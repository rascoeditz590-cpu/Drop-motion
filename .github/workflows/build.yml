name: Build Drop Motion APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check web files
        run: |
          test -f www/index.html || (echo "www/index.html nahi mila. drop-motion-app-index.html ko www/index.html naam se upload karo." && exit 1)

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.dropmotion.app",
            "appName": "Drop Motion",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: App icon (optional, assets/icon.png)
        run: |
          if [ -f assets/icon.png ]; then
            npm install -D @capacitor/assets
            npx capacitor-assets generate --android
          else
            echo "assets/icon.png nahi hai, default icon rahega"
          fi

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DropMotion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
