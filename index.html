/* ---------- projects ---------- */
function sheetNew(pre){NP=Object.assign({name:'My video',ratio:'9:16',res:1080,fps:ST.fps,dur:15},pre||{});const g=(k,arr,fmt=x=>x)=>`<div class="chips">${arr.map(x=>`<button data-npv="${k}:${x}" class="${NP[k]==x?'on':''}">${fmt(x)}</button>`).join('')}</div>`;
 openSh(`<h2>New project</h2><input type="text" id="npn" value="${NP.name}"><h4>Aspect ratio</h4>${g('ratio',['9:16','16:9','1:1','4:5','4:3','3:4','2.39:1'])}<h4>Resolution</h4>${g('res',[720,1080,1440],x=>x+'p')}<h4>Frame rate</h4>${g('fps',[24,30,60],x=>x+' fps')}<h4>Length: <span id="npdo">${NP.dur}s</span></h4><input type="range" id="npd" min="5" max="600" step="5" value="${NP.dur}"><button class="solid wide" id="npc">Create project</button>`)}
function newProject(o){PID='p'+Date.now();Object.assign(S,{name:o.name,ratio:o.ratio,res:o.res,fps:o.fps,dur:o.dur,bg:['#141a3a','#05060c'],cam:{z:1,x:0,y:0,r:0,d:0}});dims();L=[];sel=0;t=0;uid=1;panel='';hist=[];fut=[];enter();hs=snap();sv()}
function openProject(p){PID=p.id;Object.assign(S,{name:p.name,ratio:p.ratio,res:p.res,fps:p.fps,dur:p.dur,bg:p.bg,cam:p.cam});dims();const keep=p.layers.filter(l=>!['img','video','audio'].includes(l.type));L=keep;uid=Math.max(0,...p.layers.map(l=>l.id))+1;sel=0;t=0;panel='';hist=[];fut=[];enter();hs=snap();if(keep.length<p.layers.length)toast('Media files must be added again')}
function enter(){$('#home').classList.remove('on');$('#ed').classList.add('on');$('#pjn').textContent=S.name;setRes(false);setPlay(false);requestAnimationFrame(()=>{lwW=$('#lw').clientWidth||300;tlR();dockR()})}
function showHome(){$('#ed').classList.remove('on');$('#home').classList.add('on');homeR()}
/* ---------- export ---------- */
function pickMime(){const c=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'];const m=c.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||'video/webm';ext=m.startsWith('video/mp4')?'mp4':'webm';mimeBase=m.split(';')[0];return m}
function exInfo(){const el=$('#exinfo');if(el)el.textContent=`${W}×${H} · ${S.fps} fps · about ${Math.max(1,Math.round(BR*S.dur/8))} MB · ${pickMime().startsWith('video/mp4')?'MP4':'WebM'}`}
document.getElementById('xp').onclick=()=>{if(!L.length)return toast('Add something to export first');setPlay(false);
 openSh(`<h2>Export</h2><h4>Frame rate</h4><div class="chips">${[24,30,60].map(f=>`<button data-ex="${f}" class="${S.fps==f?'on':''}">${f} fps</button>`).join('')}</div><h4>Quality</h4><div class="chips">${[[6,'Low'],[12,'Medium'],[25,'High']].map(([b,n])=>`<button data-br="${b}" class="${BR==b?'on':''}">${n}</button>`).join('')}</div><p class="mu" id="exinfo"></p><div class="bar" id="exb" hidden><i></i></div><button class="solid wide" id="exgo">Export video</button>`);exInfo()};
function startExport(){if(ex)return;ex=true;setPlay(false);t=0;chx=[];$('#exb').hidden=false;$('#exgo').textContent='Exporting… keep this screen open';$('#exgo').disabled=true;selSave=sel;sel=0;setRes(true);
 const st=C.captureStream(S.fps);
 try{AC=AC||new AudioContext();const ds=AC.createMediaStreamDestination();L.forEach(l=>{if(l.el&&l.type!='img'){if(!l.node)l.node=AC.createMediaElementSource(l.el);l.node.connect(ds);l.node.connect(AC.destination)}});ds.stream.getAudioTracks().forEach(x=>st.addTrack(x))}catch(e){}
 const mt=pickMime();mrx=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:BR*1e6});mrx.ondataavailable=e=>{if(e.data.size)chx.push(e.data)};
 mrx.onstop=()=>{ex=false;sel=selSave;setRes(false);openSh(`<h2>Done</h2><video class="pv2" controls playsinline src="${URL.createObjectURL(new Blob(chx,{type:mimeBase}))}"></video><button class="solid wide" id="exsv">Save / Share video</button><button class="wide" id="exx">Close</button>`)};
 mrx.start(250);setPlay(true);const iv=setInterval(()=>{const b=$('#exb i');if(b)b.style.width=(t/S.dur*100)+'%';if(!ex)clearInterval(iv)},200)}
let selSave=0;
function fin(){setPlay(false);if(mrx&&mrx.state!='inactive')mrx.stop()}
function b64(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)})}
async function saveShare(){const b=new Blob(chx,{type:mimeBase}),name='DropMotion_'+Date.now()+'.'+ext,P=window.Capacitor&&Capacitor.Plugins;
 try{if(P&&P.Filesystem&&P.Share){const w=await P.Filesystem.writeFile({path:name,data:await b64(b),directory:'CACHE'});await P.Share.share({title:name,url:w.uri});return}
  const f=new File([b],name,{type:mimeBase});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
/* ---------- init ---------- */
/* ---------- settings, tabs, templates, profile ---------- */
const ST=Object.assign({fps:30,pq:720,mode:'pro',user:'Creator'},(()=>{try{return JSON.parse(localStorage.getItem('dm_set')||'{}')}catch(e){return{}}})());
const saveST=()=>{try{localStorage.setItem('dm_set',JSON.stringify(ST))}catch(e){}};
const setP=a=>{try{localStorage.setItem('dm_p',JSON.stringify(a))}catch(e){}};
const TPL=[
 {n:'Neon Title',r:'16:9',c:['#7C5CFF','#25D9FF'],b:()=>add({type:'text',text:'NEON NIGHTS',font:'Orbitron',fs:150,s:1,grad:'flow',c1:'#ffffff',c2:'#25D9FF',c3:'#7C5CFF',fx:{neon:1,deep:1},ain:'pop',loop:'pulse',dur:6,name:'Title'})},
 {n:'Glitch Intro',r:'16:9',c:['#FF5C73','#25D9FF'],b:()=>add({type:'text',text:'SIGNAL LOST',font:'Russo One',fs:150,s:1,fx:{tv:1.2,rgb:1},loop:'shake',ain:'fade',dur:5,name:'Glitch'})},
 {n:'Long Shadow Poster',r:'4:5',c:['#FFB84D','#FF5C73'],b:()=>{add({type:'shape',shape:'Circle',c1:'#FFB84D',s:Math.min(W,H)/320,name:'Sun'});add({type:'text',text:'SUMMER\nSALE',font:'Anton',fs:260,s:1,c1:'#ffffff',c3:'#a1163a',fx:{lshadow:1},ain:'slideUp',dur:6,name:'Headline'})}},
 {n:'Glass Quote',r:'9:16',c:['#4F7BFF','#7C5CFF'],b:()=>{add({type:'shape',shape:'Rounded',c1:'#ffffff',fx:{glass:1},s:Math.min(W,H)/200,name:'Glass card'});add({type:'text',text:'Make it\nmove.',font:'Playfair Display',fs:120,s:1,c1:'#ffffff',ain:'fade',dur:6,name:'Quote'})}},
 {n:'Lower Third',r:'16:9',c:['#38D39F','#25D9FF'],b:()=>{add({type:'shape',shape:'Diamond',c1:'#25D9FF',s:.35,x:-W*.32,y:H*.3,ain:'pop',name:'Accent'});add({type:'text',text:'Name Surname',font:'Montserrat',fs:84,s:1,x:-W*.05,y:H*.28,ain:'slideL',name:'Name'});add({type:'text',text:'Director · Editor',font:'Raleway',fs:50,s:1,c1:'#A9B0BE',x:-W*.09,y:H*.36,ain:'slideL',name:'Role'})}},
 {n:'Bounce Subtitle',r:'9:16',c:['#FFB84D','#7C5CFF'],b:()=>add({type:'text',text:'Add your line',font:'Bangers',fs:140,s:1,c1:'#ffffff',c3:'#000000',fx:{outline:1,shadow:1},loop:'bounce',y:H*.28,dur:6,name:'Subtitle'})},
 {n:'Pulse Logo',r:'1:1',c:['#7C5CFF','#25D9FF'],b:()=>{add({type:'shape',shape:'Drop',grad:'3d',c1:'#7C5CFF',c2:'#25D9FF',c3:'#2a1a7a',fx:{bloom:1},loop:'pulse',s:Math.min(W,H)/380,y:-H*.08,name:'Logo'});add({type:'text',text:'BRAND',font:'Montserrat',fs:90,s:1,y:H*.28,ain:'fade',name:'Name'})}},
 {n:'Gradient Flow Card',r:'16:9',c:['#7C5CFF','#FF5C73'],b:()=>{add({type:'shape',shape:'Rounded',grad:'flow',c1:'#7C5CFF',c2:'#25D9FF',c3:'#FF5C73',s:Math.min(W,H)/150,name:'Card'});add({type:'text',text:'Gradient Flow',font:'Poppins',fs:110,s:1,ain:'pop',name:'Title'})}}];
function useTpl(i){const x=TPL[i];newProject({name:x.n,ratio:x.r,res:1080,fps:ST.fps,dur:6});x.b();t=0;hs=snap();hist=[];tlR();dockR()}
function tplCard(x,i){return `<div class="tc" data-ti="${i}"><div class="tv" style="background:linear-gradient(135deg,${x.c[0]},${x.c[1]})">${x.n}</div><div class="ti"><b>${x.n}</b><br><small>${x.r}</small></div></div>`}
let tabNow='home',pfilter='';
function showTab(n){tabNow=n;$$('.tabp').forEach(e=>e.hidden=e.id!='t-'+n);$$('#bn button[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab==n));if(n=='profile')profR();homeR()}
$('#bn').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;if(b.dataset.tab=='create')sheetNew();else showTab(b.dataset.tab)});
function projCard(p,i,mb){const th=`linear-gradient(135deg,${p.bg[0]},${p.bg[1]})`;return `<div class="pc" data-i="${i}"><div class="pv" style="background:${th}">${p.name}<button class="mb" data-mb="${i}">${ic('dots',18)}</button></div><div class="pi"><b>${p.name}</b><span class="badge">Draft</span><br><small>${p.ratio} · ${Math.round(p.dur)}s · ${p.layers.length} layers</small></div></div>`}
function homeR(){const ps=getP();$('#pempty').hidden=ps.length>0;$('#recent').innerHTML=ps.slice(0,5).map((p,i)=>projCard(p,i)).join('');
 $('#thome').innerHTML=TPL.map(tplCard).join('');$('#tgrid').innerHTML=TPL.map(tplCard).join('');
 const q=pfilter.toLowerCase();$('#plist').innerHTML=ps.map((p,i)=>[p,i]).filter(([p])=>!q||p.name.toLowerCase().includes(q)||p.ratio.includes(q)).map(([p,i])=>projCard(p,i)).join('')||'<p class="mu">Nothing here yet.</p>'}
document.addEventListener('click',e=>{if(!$('#home').classList.contains('on'))return;
 const mb=e.target.closest('[data-mb]');if(mb){e.stopPropagation();return sheetProj(+mb.dataset.mb)}
 const pc=e.target.closest('.pc');if(pc)return openProject(getP()[+pc.dataset.i]);
 const tc=e.target.closest('.tc');if(tc)return useTpl(+tc.dataset.ti)},true);
$('#pq').addEventListener('input',e=>{pfilter=e.target.value;homeR()});
$('#hs').onclick=()=>{showTab('projects');$('#pq').focus()};
$('#np').onclick=()=>sheetNew();
$$('[data-q]').forEach(b=>b.onclick=()=>sheetNew({ratio:b.dataset.q}));
function sheetProj(i){const p=getP()[i];if(!p)return;openSh(`<h2>${p.name}</h2><div class="acts"><button data-pa="open" data-i="${i}">${ic('play',20)}Open</button><button data-pa="dup" data-i="${i}">${ic('copy',20)}Duplicate</button><button data-pa="ren" data-i="${i}">${ic('text',20)}Rename</button><button data-pa="del" data-i="${i}">${ic('trash',20)}Delete</button></div>`)}
$('#sh').addEventListener('click',e=>{const b=e.target.closest('[data-pa]');if(!b)return;const i=+b.dataset.i,ps=getP(),p=ps[i],a=b.dataset.pa;
 if(a=='open'){closeSh();openProject(p)}
 else if(a=='dup'){ps.splice(i+1,0,Object.assign({},p,{id:'p'+Date.now(),name:p.name+' copy',ts:Date.now()}));setP(ps);closeSh();homeR()}
 else if(a=='del'){ps.splice(i,1);setP(ps);closeSh();homeR();profR()}
 else if(a=='ren')openSh(`<h2>Rename</h2><input type="text" id="rnv" value="${p.name.replace(/"/g,'&quot;')}"><button class="solid wide" data-pa="rens" data-i="${i}">Save</button>`)
 else if(a=='rens'){p.name=$('#rnv').value||p.name;setP(ps);closeSh();homeR()}
 else if(a=='un'){ST.user=$('#unv').value||'Creator';saveST();closeSh();profR()}
 else if(a=='clr'){setP([]);closeSh();homeR();profR()}});
function profR(){const ps=getP(),kb=(()=>{try{return Math.round((localStorage.getItem('dm_p')||'').length/1024)}catch(e){return 0}})(),ch=(k,arr,fmt=x=>x)=>`<div class="chips">${arr.map(v=>`<button data-st="${k}:${v}" class="${ST[k]==v?'on':''}">${fmt(v)}</button>`).join('')}</div>`;
 $('#t-profile').innerHTML=`<div style="display:flex;gap:14px;align-items:center;margin-top:6px"><div class="av">${ST.user[0].toUpperCase()}</div><div style="flex:1"><b style="font-size:18px">${ST.user}</b><br><span class="mu">Local profile · saved on this phone</span></div><button data-do2="un">Edit</button></div>
 <div class="stat"><div><b>${ps.length}</b><span>Projects</span></div><div><b>${ps.reduce((a,p)=>a+p.layers.length,0)}</b><span>Layers</span></div><div><b>${kb} KB</b><span>Storage</span></div></div>
 <h4>Mode</h4>${ch('mode',['quick','pro'],v=>v=='pro'?'Pro Motion':'Quick')}
 <h4>Default frame rate</h4>${ch('fps',[24,30,60],v=>v+' fps')}
 <h4>Preview quality</h4>${ch('pq',[480,720,1080],v=>v+'p')}
 <h4>Data</h4><div class="chips"><button data-do2="clr">${ic('trash',18)} Clear all projects</button></div><p class="mu">Projects and settings stay on your phone. Cloud backup and login need a server and are not part of this build.</p>`}
$('#t-profile').addEventListener('click',e=>{const s=e.target.closest('[data-st]');if(s){const[k,v]=s.dataset.st.split(':');ST[k]=isNaN(v)?v:+v;saveST();profR();return}
 const d=e.target.closest('[data-do2]');if(!d)return;if(d.dataset.do2=='un')openSh(`<h2>Your name</h2><input type="text" id="unv" value="${ST.user}"><button class="solid wide" data-pa="un" data-i="0">Save</button>`);else openSh(`<h2>Clear all projects?</h2><p class="mu">This cannot be undone.</p><button class="solid wide" data-pa="clr" data-i="0">Clear</button>`)});
/* ---------- command search ---------- */
function needL(f){return()=>{const l=cur();if(!l)return toast('Select a layer first');f(l)}}
function commands(){const c=[],A=(n,k,f,g)=>c.push({n,k,f,g});
 A('Add text','title caption type words',addText,'Add');A('Add shape','star circle heart',sheetShapes,'Add');A('Add media','video photo image gif',()=>pick('image/*,video/*'),'Add');A('Add audio','music sound song',()=>pick('audio/*'),'Add');A('Record voice','mic voiceover',rec,'Add');A('Add null object','parent controller',()=>add({type:'null',name:'Null'}),'Add');
 Object.entries(FXL).forEach(([k,v])=>A('Add '+v[1],v[0]+' effect '+(k=='lshadow'?'shadow':''),needL(l=>{l.fx[k]=FXD[k]!==undefined?FXD[k]:1;commit();panel='fx';dockR()}),'Effect'));
 Object.entries(AIN).forEach(([n,v])=>v!='none'&&A('Animate in: '+n,'intro entrance',needL(l=>{l.ain=v;t=l.start;commit();panel='anim';dockR()}),'Animate'));
 Object.entries(ALOOP).forEach(([n,v])=>v!='none'&&A('Loop: '+n,'idle loop motion',needL(l=>{l.loop=v;commit();panel='anim';dockR()}),'Animate'));
 Object.entries(AOUT).forEach(([n,v])=>v!='none'&&A('Animate out: '+n,'outro exit',needL(l=>{l.out=v;commit();panel='anim';dockR()}),'Animate'));
 A('Make 3D','tilt turn depth perspective',needL(l=>{setProp(l,'rx',-20);setProp(l,'ry',28);commit();dockR()}),'3D');A('Slow zoom','camera push drift cinematic',()=>{S.cam.d=1.2;commit();toast('Slow zoom on (Scene)')},'Camera');
 A('Split at playhead','cut',split,'Edit');A('Duplicate layer','copy',needL(l=>act('dup')),'Edit');A('Delete layer','remove',needL(l=>act('del')),'Edit');A('Group layer','null parent',needL(l=>act('grp')),'Edit');A('Add keyframe','diamond animate',needL(l=>{PR.forEach(k=>setKF(l,k,t,V(l,k,t)));commit();tlR();panel='move';dockR()}),'Edit');
 A('Undo','back',undo,'Edit');A('Redo','forward',redo,'Edit');A('Export video','render save share',()=>$('#xp').click(),'Project');A('Scene & camera','background length',()=>$('#gr').click(),'Project');A('Focus mode','clean',()=>$('#foc').click(),'Project');
 return c}
function sheetCmd(){openSh(`<input type="text" id="cq" placeholder="Try: add glow, make 3D, split…"><div id="cr" style="margin-top:8px"></div>`);cmdR();setTimeout(()=>$('#cq')&&$('#cq').focus(),50)}
function cmdR(){const q=($('#cq').value||'').toLowerCase().split(/\s+/).filter(Boolean),all=commands(),r=all.filter(c=>q.every(w=>(c.n+' '+c.k+' '+c.g).toLowerCase().includes(w))).slice(0,q.length?12:8);window._cr=r;
 $('#cr').innerHTML=r.map((c,i)=>`<button class="cmd" data-ci="${i}">${c.n}<small>${c.g}</small></button>`).join('')||'<p class="mu">No match. Try “glow”, “shake” or “split”.</p>'}
$('#sh').addEventListener('input',e=>{if(e.target.id=='cq')cmdR()});
$('#sh').addEventListener('click',e=>{const b=e.target.closest('[data-ci]');if(!b)return;const c=window._cr[+b.dataset.ci];closeSh();c.f()});
$('#srch').onclick=sheetCmd;
$('#foc').onclick=()=>{$('#ed').classList.toggle('fo');setTimeout(tlR,50)};
/* ---------- init ---------- */
$$('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,+e.dataset.s||22));
const NV={home:['home','Home'],projects:['folder','Projects'],templates:['tpl','Templates'],profile:['user','Profile']};
$$('#bn button[data-tab]').forEach(b=>{const n=NV[b.dataset.tab];if(n)b.innerHTML=ic(n[0],22)+'<span>'+n[1]+'</span>'});
window.addEventListener('resize',()=>{lwW=$('#lw').clientWidth||300;if($('#ed').classList.contains('on'))tlR()});
FONTS.slice(0,10).forEach(n=>{try{document.fonts.load(`40px "${n}"`)}catch(_){}});
showTab('home');requestAnimationFrame(loop);
</script></body></html>
