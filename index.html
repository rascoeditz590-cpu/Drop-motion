<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Poppins&family=Montserrat&family=Oswald&family=Anton&family=Bebas+Neue&family=Lobster&family=Pacifico&family=Permanent+Marker&family=Orbitron&family=Playfair+Display&family=Righteous&family=Bangers&family=Caveat&family=Dancing+Script&family=Satisfy&family=Press+Start+2P&family=Russo+One&family=Archivo+Black&family=Abril+Fatface&family=Cinzel&family=Raleway&family=Fredoka&family=Teko&family=Hind&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2033;--p1:#262a44;--p2:#323759;--p3:#424974;--ln:#3b4166;--tx:#FFFFFF;--mu:#BAC0DC;--ac:#16c995;--acx:#ffffff;--cy:#25D9FF;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:13px/1.3 "Plus Jakarta Sans",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:var(--p2);border:0;border-radius:12px;min-height:40px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
button:active{background:var(--p3)}
button.on{background:var(--ac);color:#fff;font-weight:800}.solid,button.solid:active{background:linear-gradient(135deg,#7C5CFF,#4F7BFF);color:#fff;font-weight:800}
input[type=text],textarea,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);font:inherit;user-select:text;-webkit-user-select:text}
textarea{min-height:64px;resize:none}
input[type=range]{accent-color:var(--ac);width:100%;margin:0}
input[type=color]{width:100%;height:40px;border:0;background:none;padding:0}
h2,h3,h4{margin:0 0 8px}h2{font-size:18px;font-weight:800}h4{margin:12px 0 4px;color:var(--mu);font-size:12px}
.mu{color:var(--mu)}.wide{width:100%;min-height:48px;margin-top:14px}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.scr.on{display:flex}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.chips button{min-height:36px}
/* home */
.hhead{padding:18px 18px 6px;display:flex;align-items:center;gap:10px}.hhead b{font-size:22px;font-weight:800}
.hbody{flex:1;overflow:auto;padding:10px 18px 24px}
.big{width:100%;min-height:58px;font-size:16px;border-radius:16px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 18px}.quick button{flex-direction:column;height:64px;gap:2px}.quick small{color:var(--mu);font-weight:500}
.pl{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pc{background:var(--p1);border-radius:16px;overflow:hidden;cursor:pointer}.pc .pv{height:92px;display:grid;place-items:center;font-weight:800;color:#fff;padding:6px;text-align:center}.pc .pi{padding:8px 10px}.pc small{color:var(--mu)}
/* editor */
#ed{flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;height:52px;flex:none}
.top .nm{flex:1;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq{width:40px;padding:0}
#stage{flex:none;height:33dvh;display:flex;align-items:center;justify-content:center;background:#05060b}
#c{max-width:100%;max-height:100%;touch-action:none;display:block}
.ctl{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;gap:6px}.ctl .grp{display:flex;gap:6px}
#tl{position:relative;flex:1;min-height:90px;display:flex;flex-direction:column;background:var(--p1);border-top:1px solid var(--ln);overflow:hidden}
#rul{height:24px;display:flex;flex:none;border-bottom:1px solid var(--ln)}
#zm{width:52px;display:flex;gap:2px;align-items:center;justify-content:center;flex:none}
#zm button{min-height:22px;width:22px;padding:0;border-radius:6px}
#rw{flex:1;overflow:hidden;position:relative;touch-action:pan-y}
#rin{position:absolute;left:0;top:0;height:24px;background-image:linear-gradient(90deg,var(--mu) 1px,transparent 1px);background-repeat:repeat-x;background-position:left bottom;background-size:20px 7px}
#rin span{position:absolute;top:1px;font-size:10px;color:var(--mu);padding-left:3px}
#vs{flex:1;overflow-y:auto;overflow-x:hidden;display:flex}
#gut{width:52px;flex:none;background:var(--p1);z-index:2}
.g{height:44px;display:flex;align-items:center;gap:2px;padding-left:2px;border-bottom:1px solid var(--ln)}.g.on{background:var(--p2)}
.eye{min-height:30px;width:26px;padding:0;background:none}
.th{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#fff;font-style:normal}
#lw{flex:1;position:relative;overflow:hidden;touch-action:pan-y}
#inner{position:relative;min-height:10px}
.lr{height:44px;border-bottom:1px solid var(--ln);position:relative}
.clip{position:absolute;top:5px;height:34px;border-radius:9px;color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;padding:0 14px;overflow:hidden;white-space:nowrap;outline:2px solid transparent}
.clip.on{outline-color:#fff}
.clip .h{position:absolute;top:0;bottom:0;width:12px;background:rgba(255,255,255,.35)}.hs{left:0;border-radius:9px 0 0 9px}.he{right:0;border-radius:0 9px 9px 0}
.clip u{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;background:#fff;transform:rotate(45deg)}
#ph{position:absolute;top:0;bottom:0;left:calc(52px + (100% - 52px)/2);width:2px;margin-left:-1px;background:var(--cy);z-index:3;pointer-events:none}
#tb{position:absolute;bottom:14px;left:calc(52px + (100% - 52px)/2);transform:translateX(-50%);background:var(--cy);color:#04222b;font-weight:800;font-size:11px;padding:2px 7px;border-radius:8px;z-index:4;pointer-events:none}
#fab{position:absolute;right:14px;bottom:12px;width:54px;height:54px;border-radius:50%;padding:0;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.po #fab{display:none}
#dock{flex:none;background:rgba(20,24,33,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln)}
.tools{display:flex;gap:8px;overflow-x:auto;padding:10px}
.tb{flex-direction:column;min-width:64px;height:62px;gap:4px;padding:0 6px}.tb small{font-size:10px;font-weight:700}
#dock.open{display:flex;flex-direction:column;max-height:36dvh}
.ph{display:flex;align-items:center;gap:8px;padding:8px 10px;flex:none}.ph b{font-size:14px}.sp{flex:1}
.pb{overflow:auto;padding:0 12px 12px}
.sl{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:8px;margin:4px 0;min-height:30px}.sl span{color:var(--mu)}.sl output{text-align:right;font-variant-numeric:tabular-nums}
.tile{flex-direction:column;height:64px;width:calc(25% - 6px);gap:4px;font-size:11px;padding:0 4px;text-align:center}
.tile.on small{color:var(--acx)}
.sw{width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;border:2px solid var(--p3)}
.fc{min-height:36px;white-space:nowrap}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.acts button{flex-direction:column;height:62px;font-size:11px}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20}
#sh{width:100%;max-width:520px;margin:0 auto;background:rgba(20,24,33,.96);backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:86dvh;overflow:auto}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.agrid button{flex-direction:column;height:84px;gap:6px}
.shg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.shg button{height:64px;padding:0}
.bar{height:10px;border-radius:6px;background:var(--p2);overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7C5CFF,#25D9FF)}
#ts{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 14px;border-radius:20px;font-weight:800;z-index:30;max-width:90%}
video.pv2{width:100%;max-height:40dvh;border-radius:12px;background:#000}

.hhead .sp{flex:1}
.hero{width:100%;min-height:92px;border-radius:20px;border:1px solid rgba(124,92,255,.5);background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(37,217,255,.12));backdrop-filter:blur(14px);justify-content:flex-start;padding:0 20px;text-align:left}
.hero b{display:block;font-size:20px}.hero span{color:var(--mu);font-weight:500}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}.hs .pc,.hs .tc{min-width:150px;max-width:150px;flex:none}
.pc .pv{position:relative}.pc .mb{position:absolute;right:6px;top:6px;width:30px;min-height:30px;padding:0;background:rgba(11,13,18,.6);border-radius:10px}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--p3);color:var(--mu);margin-left:4px}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tc{border-radius:16px;overflow:hidden;background:var(--p1);cursor:pointer}.tc .tv{height:110px;display:grid;place-items:center;color:#fff;font-weight:800;text-align:center;padding:8px}.tc .ti{padding:8px 10px}.tc small{color:var(--mu)}
#bn{flex:none;display:flex;justify-content:space-around;align-items:center;padding:6px 8px;background:rgba(20,24,33,.92);border-top:1px solid var(--ln);backdrop-filter:blur(16px)}
#bn button{flex-direction:column;background:none;min-height:50px;min-width:58px;padding:0 4px;gap:2px;color:var(--mu);font-size:10px;font-weight:700}
#bn button.on{background:none;color:var(--tx)}#bn button.on svg{color:var(--cy)}
#bn .plus{width:54px;min-height:54px;border-radius:50%;padding:0;background:linear-gradient(135deg,#7C5CFF,#25D9FF);color:#fff;box-shadow:0 6px 20px rgba(124,92,255,.5)}
.hbody h3{margin:18px 0 8px;font-size:15px}.hbody .quick{grid-template-columns:repeat(3,1fr)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stat div{background:var(--p1);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat span{color:var(--mu);font-size:11px}
.av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#7C5CFF,#25D9FF);display:grid;place-items:center;font-size:26px;font-weight:800}
.cmd{display:flex;width:100%;justify-content:flex-start;margin:4px 0;text-align:left;min-height:44px}.cmd small{color:var(--mu);margin-left:auto}
.ctl .sq{width:36px;min-height:36px}
.fo .top,.fo #dock{display:none}.fo #stage{height:46dvh}
button:not(.eye){background:linear-gradient(180deg,#444b7a,#323759);box-shadow:0 4px 0 #14172b,0 7px 12px #0006,inset 0 1px 0 #ffffff2e;transition:transform .07s,box-shadow .07s}
button:not(.eye):active{transform:translateY(3px);box-shadow:0 1px 0 #14172b,inset 0 3px 8px #0006}
button.on:not(.eye),button.solid{background:linear-gradient(180deg,#34e6b0,#10b88a);box-shadow:0 4px 0 #087a5b,0 7px 14px #16c99555,inset 0 1px 0 #ffffff55}
button.on:not(.eye):active{box-shadow:0 1px 0 #087a5b,inset 0 3px 8px #0006}
#gut .g.drag{transform:scale(1.1);box-shadow:0 10px 24px #000b,0 0 0 2px #25D9FF;z-index:9;position:relative}
button.tile .fxth{width:56px;height:56px;border-radius:12px;display:block;margin:0 auto 4px;box-shadow:0 3px 8px #0008}
#brandlogo{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;width:34px;height:34px;border-radius:9px;z-index:2;pointer-events:none;box-shadow:0 0 12px #25d9ff66}

function sheetProj(i){const p=getP()[i];if(!p)return;openSh(`<h2>${p.name}</h2><div class="acts"><button data-pa="open" data-i="${i}">${ic('play',20)}Open</button><button data-pa="dup" data-i="${i}">${ic('copy',20)}Duplicate</button><button data-pa="ren" data-i="${i}">${ic('text',20)}Rename</button><button data-pa="del" data-i="${i}">${ic('trash',20)}Delete</button></div>`)}
$('#sh').addEventListener('click',e=>{const b=e.target.closest('[data-pa]');if(!b)return;const i=+b.dataset.i,ps=getP(),p=ps[i],a=b.dataset.pa;
 if(a=='open'){closeSh();openProject(p)}
 else if(a=='dup'){ps.splice(i+1,0,Object.assign({},p,{id:'p'+Date.now(),name:p.name+' copy',ts:Date.now()}));setP(ps);closeSh();homeR()}
 else if(a=='del'){ps.splice(i,1);setP(ps);closeSh();homeR();profR()}
 else if(a=='ren')openSh(`<h2>Rename</h2><input type="text" id="rnv" value="${p.name.replace(/"/g,'&quot;')}"><button class="solid wide" data-pa="rens" data-i="${i}">Save</button>`)
 else if(a=='rens'){p.name=$('#rnv').value||p.name;setP(ps);closeSh();homeR()}
 else if(a=='un'){ST.user=$('#unv').value||'Creator';saveST();closeSh();profR()}
 else if(a=='clr'){setP([]);closeSh();homeR();profR()}});
function profR(){const ps=getP(),kb=(()=>{try{return Math.round((localStorage.getItem('dm_p')||'').length/1024)}catch(e){return 0}})(),ch=(k,arr,fmt=x=>x)=>`<div class="chips">${arr.map(v=>`<button data-st="${k}:${v}" class="${ST[k]==v?'on':''}">${fmt(v)}</button>`).join('')}</div>`;
 $('#t-profile').innerHTML=`<div style="display:flex;gap:14px;align-items:center;margin-top:6px"><div class="av">${ST.user[0].toUpperCase()}</div><div style="flex:1"><b style="font-size:18px">${ST.user}</b><br><span class="mu">Local profile · saved on this phone</span></div><button data-do2="un">Edit</button></div>
 <div class="stat"><div><b>${ps.length}</b><span>Projects</span></div><div><b>${ps.reduce((a,p)=>a+p.layers.length,0)}</b><span>Layers</span></div><div><b>${kb} KB</b><span>Storage</span></div></div>
 <h4>Mode</h4>${ch('mode',['quick','pro'],v=>v=='pro'?'Pro Motion':'Quick')}
 <h4>Default frame rate</h4>${ch('fps',[24,30,60],v=>v+' fps')}
 <h4>Preview quality</h4>${ch('pq',[480,720,1080],v=>v+'p')}
 <h4>Data</h4><div class="chips"><button data-do2="clr">${ic('trash',18)} Clear all projects</button></div><p class="mu">Projects and settings stay on your phone. Cloud backup and login need a server and are not part of this build.</p>`}
$('#t-profile').addEventListener('click',e=>{const s=e.target.closest('[data-st]');if(s){const[k,v]=s.dataset.st.split(':');ST[k]=isNaN(v)?v:+v;saveST();profR();return}
 const d=e.target.closest('[data-do2]');if(!d)return;if(d.dataset.do2=='un')openSh(`<h2>Your name</h2><input type="text" id="unv" value="${ST.user}"><button class="solid wide" data-pa="un" data-i="0">Save</button>`);else openSh(`<h2>Clear all projects?</h2><p class="mu">This cannot be undone.</p><button class="solid wide" data-pa="clr" data-i="0">Clear</button>`)});
/* ---------- command search ---------- */
function needL(f){return()=>{const l=cur();if(!l)return toast('Select a layer first');f(l)}}
function commands(){const c=[],A=(n,k,f,g)=>c.push({n,k,f,g});
 A('Add text','title caption type words',addText,'Add');A('Add shape','star circle heart',sheetShapes,'Add');A('Add media','video photo image gif',()=>pick('image/*,video/*'),'Add');A('Add audio','music sound song',()=>pick('audio/*'),'Add');A('Record voice','mic voiceover',rec,'Add');A('Add null object','parent controller',()=>add({type:'null',name:'Null'}),'Add');
 Object.entries(FXL).forEach(([k,v])=>A('Add '+v[1],v[0]+' effect '+(k=='lshadow'?'shadow':''),needL(l=>{l.fx[k]=FXD[k]!==undefined?FXD[k]:1;commit();panel='fx';dockR()}),'Effect'));
 Object.entries(AIN).forEach(([n,v])=>v!='none'&&A('Animate in: '+n,'intro entrance',needL(l=>{l.ain=v;t=l.start;commit();panel='anim';dockR()}),'Animate'));
 Object.entries(ALOOP).forEach(([n,v])=>v!='none'&&A('Loop: '+n,'idle loop motion',needL(l=>{l.loop=v;commit();panel='anim';dockR()}),'Animate'));
 Object.entries(AOUT).forEach(([n,v])=>v!='none'&&A('Animate out: '+n,'outro exit',needL(l=>{l.out=v;commit();panel='anim';dockR()}),'Animate'));
 A('Make 3D','tilt turn depth perspective',needL(l=>{setProp(l,'rx',-20);setProp(l,'ry',28);commit();dockR()}),'3D');A('Slow zoom','camera push drift cinematic',()=>{S.cam.d=1.2;commit();toast('Slow zoom on (Scene)')},'Camera');
 A('Split at playhead','cut',split,'Edit');A('Duplicate layer','copy',needL(l=>act('dup')),'Edit');A('Delete layer','remove',needL(l=>act('del')),'Edit');A('Group layer','null parent',needL(l=>act('grp')),'Edit');A('Add keyframe','diamond animate',needL(l=>{PR.forEach(k=>setKF(l,k,t,V(l,k,t)));commit();tlR();panel='move';dockR()}),'Edit');
 A('Undo','back',undo,'Edit');A('Redo','forward',redo,'Edit');A('Export video','render save share',()=>$('#xp').click(),'Project');A('Scene & camera','background length',()=>$('#gr').click(),'Project');A('Focus mode','clean',()=>$('#foc').click(),'Project');
 return c}
function sheetCmd(){openSh(`<input type="text" id="cq" placeholder="Try: add glow, make 3D, split…"><div id="cr" style="margin-top:8px"></div>`);cmdR();setTimeout(()=>$('#cq')&&$('#cq').focus(),50)}
function cmdR(){const q=($('#cq').value||'').toLowerCase().split(/\s+/).filter(Boolean),all=commands(),r=all.filter(c=>q.every(w=>(c.n+' '+c.k+' '+c.g).toLowerCase().includes(w))).slice(0,q.length?12:8);window._cr=r;
 $('#cr').innerHTML=r.map((c,i)=>`<button class="cmd" data-ci="${i}">${c.n}<small>${c.g}</small></button>`).join('')||'<p class="mu">No match. Try “glow”, “shake” or “split”.</p>'}
$('#sh').addEventListener('input',e=>{if(e.target.id=='cq')cmdR()});
$('#sh').addEventListener('click',e=>{const b=e.target.closest('[data-ci]');if(!b)return;const c=window._cr[+b.dataset.ci];closeSh();c.f()});
$('#srch').onclick=sheetCmd;
$('#foc').onclick=()=>{$('#ed').classList.toggle('fo');setTimeout(tlR,50)};
/* ---------- init ---------- */
$$('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,+e.dataset.s||22));
const NV={home:['home','Home'],projects:['folder','Projects'],templates:['tpl','Templates'],profile:['user','Profile']};
$$('#bn button[data-tab]').forEach(b=>{const n=NV[b.dataset.tab];if(n)b.innerHTML=ic(n[0],22)+'<span>'+n[1]+'</span>'});
window.addEventListener('resize',()=>{lwW=$('#lw').clientWidth||300;if($('#ed').classList.contains('on'))tlR()});
FONTS.slice(0,10).forEach(n=>{try{document.fonts.load(`40px "${n}"`)}catch(_){}});
showTab('home');requestAnimationFrame(loop);
(()=>{const g=document.getElementById('gut');let d=null;
g.addEventListener('pointerdown',e=>{const r=e.target.closest('.g');if(!r||e.target.closest('.eye'))return;d={r,l:byId(r.dataset.id),y0:e.clientY,on:false};d.tm=setTimeout(()=>{d.on=true;r.classList.add('drag');navigator.vibrate&&navigator.vibrate(18)},280)});
g.addEventListener('pointermove',e=>{if(!d)return;if(!d.on){if(Math.abs(e.clientY-d.y0)>10){clearTimeout(d.tm);d=null}return}d.r.style.transform='translateY('+(e.clientY-d.y0)+'px) scale(1.1)'});
g.addEventListener('touchmove',e=>{if(d&&d.on)e.preventDefault()},{passive:false});
const end=e=>{if(!d)return;clearTimeout(d.tm);if(d.on&&d.l){const st=Math.round((e.clientY-d.y0)/(d.r.offsetHeight||44)),i=L.indexOf(d.l),ni=Math.max(0,Math.min(L.length-1,i-st));if(ni!=i){try{commit()}catch(x){}L.splice(i,1);L.splice(ni,0,d.l)}}d=null;tlR()};
g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end)})();
</script></body></html>
